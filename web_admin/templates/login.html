{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 shadow">
      <div class="text-center mb-4">
        <i class="bi bi-book-half" style="font-size:2.5rem;color:#3b82f6"></i>
        <h4 class="mt-2">پنل مدیریت ربات</h4>
        <p class="text-muted small">رمز عبور ادمین را وارد کنید</p>
      </div>
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input type="password" name="password" class="form-control form-control-lg" required autofocus placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">ورود</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
